name: Fix PDF rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken HTML PDF renderer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          pattern=r"async function downloadVisiblePdf\(\).*?;document\.getElementById\('printModal'\)\.addEventListener"
          replacement=r'''async function downloadVisiblePdf(){var source=document.querySelector('#printContent .invoice-ref');var btn=document.getElementById('previewDownload');var num=(window.currentInvoiceNumber||'invoice').replace(/[^a-z0-9_-]/gi,'_');if(!source||!btn){alert('Invoice preview is not ready.');return}if(!window.html2canvas||!window.jspdf||!window.jspdf.jsPDF){alert('PDF engine did not load. Refresh the page and try again.');return}btn.disabled=true;btn.textContent='Preparing PDF…';try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});var canvas=await window.html2canvas(source,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0,width:source.scrollWidth,height:source.scrollHeight});var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});var pageW=190;var pageH=277;var pxPerMm=canvas.width/pageW;var slicePx=Math.floor(pageH*pxPerMm);var y=0;var page=0;while(y<canvas.height){var h=Math.min(slicePx,canvas.height-y);var slice=document.createElement('canvas');slice.width=canvas.width;slice.height=h;var ctx=slice.getContext('2d');ctx.drawImage(canvas,0,y,canvas.width,h,0,0,canvas.width,h);var img=slice.toDataURL('image/jpeg',0.95);var imgH=h/pxPerMm;if(page>0)pdf.addPage();pdf.addImage(img,'JPEG',10,10,pageW,imgH,'FAST');y+=h;page++}pdf.setProperties({title:'BHIVE Invoice '+num,author:'BHIVE Resource Intl LTD'});pdf.save('BHIVE-'+num+'.pdf')}catch(err){console.error('PDF export error',err);alert('PDF could not be generated: '+(err.message||'Please try again.'))}finally{btn.disabled=false;btn.textContent='Download PDF'}};document.getElementById('printModal').addEventListener'''
          ns,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('PDF function marker not found')
          p.write_text(ns,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-pdf-render.yml
          git add index.html
          git commit -m "Render downloaded PDF from exact invoice preview" || exit 0
          git push