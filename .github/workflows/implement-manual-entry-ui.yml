name: Implement manual entry UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manual entry UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('.entry-table{border:1px solid #dfe6da;border-radius:10px;overflow:hidden}.entry-head,.line{display:grid;grid-template-columns:1.05fr 1.25fr 1fr .7fr .9fr 1fr 42px;gap:0;align-items:center}.entry-head{background:#D2D9EB;font-weight:900;font-size:12px;padding:10px}.line{padding:8px;border-top:1px solid #edf0eb}.line input{border-radius:6px;margin-right:7px}.auto-day,.auto-amount{font-size:13px;font-weight:700;color:#4d584b;padding:0 7px}.auto-amount{color:#111}', '.entry-table{border:1px solid #dfe6da;border-radius:12px;overflow:hidden;background:#fff}.entry-head,.line{display:grid;grid-template-columns:1.15fr 1.35fr 1.05fr .65fr .9fr 1fr 52px;gap:14px;align-items:center}.entry-head{background:#D2D9EB;font-weight:900;font-size:12px;padding:14px 16px}.line{padding:16px;border-top:1px solid #edf0eb}.line input,.line select{width:100%;min-width:0;border-radius:8px;margin:0;padding:11px 12px}.line select{border:1px solid #cfd8ca;background:#fff;color:#243020}.auto-day,.auto-amount{font-size:13px;font-weight:700;color:#4d584b;padding:0 4px}.auto-amount{color:#111}.manual-entry-wrap{padding:4px}.entry-add{padding:14px 16px;border-top:1px dashed #dfe6da}.entry-head span:last-child{text-align:center}.remove-line{justify-self:center}')
          s=s.replace('<div class="entry-table"><div class="entry-head"><span>Date</span><span>Items</span><span>Day</span><span>Qty</span><span>Rate (₦)</span><span>Amount (₦)</span><span></span></div><div id="invoiceLines"></div></div>', '<div class="entry-table"><div class="entry-head"><span>Date</span><span>Items</span><span>Day</span><span>Qty</span><span>Rate (₦)</span><span>Amount (₦)</span><span>Action</span></div><div id="invoiceLines"></div><div class="entry-add"><button type="button" id="addLine" class="btn primary">+ Add Day</button></div></div>')
          # Remove duplicate Add Day button from the manual section header, if present.
          s=s.replace('<button type="button" id="addLine" class="btn primary">+ Add day</button></div></div><div class="entry-table">','</div></div><div class="entry-table">')
          # Make the day a real selectable input and keep it synchronized with the chosen date.
          old="div.innerHTML='<input type=\"date\" value=\"'+r.date+'\"><input type=\"text\" value=\"'+(r.item||'')+'\" placeholder=\"e.g. Staff meals\"><span class=\"auto-day\">'+day+'</span><input type=\"number\" min=\"0\" value=\"'+r.qty+'\" placeholder=\"0\"><input type=\"number\" min=\"0\" value=\"'+r.rate+'\" placeholder=\"0\"><span class=\"auto-amount\">'+money(amount)+'</span><button type=\"button\" class=\"remove-line\" aria-label=\"Remove line\">×</button>';"
          new="div.innerHTML='<input type=\"date\" value=\"'+r.date+'\"><input type=\"text\" value=\"'+(r.item||'')+'\" placeholder=\"e.g. Staff meals\"><select aria-label=\"Day of week\"><option value=\"\">Select day</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option></select><input type=\"number\" min=\"0\" value=\"'+r.qty+'\" placeholder=\"0\"><input type=\"number\" min=\"0\" value=\"'+r.rate+'\" placeholder=\"0\"><span class=\"auto-amount\">'+money(amount)+'</span><button type=\"button\" class=\"remove-line\" aria-label=\"Remove line\">×</button>';"
          if old not in s: raise SystemExit('row markup not found')
          s=s.replace(old,new,1)
          s=s.replace("var inputs=div.querySelectorAll('input');inputs[0].addEventListener('input',function(){r.date=this.value;renderRows()});inputs[1].addEventListener('input',function(){r.item=this.value});inputs[2].addEventListener('input',function(){r.qty=this.value;renderRows()});inputs[3].addEventListener('input',function(){r.rate=this.value;renderRows()});", "var inputs=div.querySelectorAll('input');var daySelect=div.querySelector('select');inputs[0].addEventListener('input',function(){r.date=this.value;renderRows()});inputs[1].addEventListener('input',function(){r.item=this.value});daySelect.value=day;daySelect.addEventListener('change',function(){r.dayOverride=this.value;renderRows()});inputs[2].addEventListener('input',function(){r.qty=this.value;renderRows()});inputs[3].addEventListener('input',function(){r.rate=this.value;renderRows()});")
          # If a day is explicitly selected, retain it; otherwise calculate from the date.
          s=s.replace("var day=weekday(r.date);", "var day=r.dayOverride||weekday(r.date);")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script></body>',s,re.S).group(1)
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/implement-manual-entry-ui.yml
          git add index.html
          git commit -m "Improve manual entry spacing and add day selector"
          git push