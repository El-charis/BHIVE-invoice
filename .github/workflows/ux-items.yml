name: Improve button UX and add items column
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update invoice UX and items
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Strong, unmistakably interactive controls with accessible contrast.
          s=re.sub(r'\.btn\{[^}]*\}', '.btn{border:1px solid #4b5a46;background:#fff;color:#243020;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .05s}', s, count=1)
          s=re.sub(r'\.primary\{[^}]*\}\.primary:hover\{[^}]*\}\.primary:active\{[^}]*\}\.primary:disabled\{[^}]*\}', '.primary{background:#4F9D39;color:#fff;border:1px solid #3E7F2D;box-shadow:0 1px 2px #17300f22}.primary:hover{background:#3F882F;border-color:#326D25}.primary:focus-visible,.btn:focus-visible{outline:3px solid #B7E8A4;outline-offset:2px}.primary:active{background:#326D25;border-color:#28561E;transform:translateY(1px)}.primary:disabled{background:#AEB8AA;border-color:#929D8F;color:#fff;cursor:not-allowed;box-shadow:none}', s, count=1)
          s=s.replace('.tabs button.active{background:#58A83D;color:#fff;box-shadow:0 2px 7px #58A83D44}', '.tabs button.active{background:#3E7F2D;color:#fff;border:1px solid #326D25;box-shadow:0 2px 7px #326D2533}.tabs button:hover:not(.active){background:#fff;color:#243020}', 1)
          s=s.replace('.nav button.active{background:#58A83D;color:#fff}.nav button:hover{background:#eaf6e3;color:#315323}', '.nav button.active{background:#3E7F2D;color:#fff;box-shadow:0 2px 5px #326D2533}.nav button:hover:not(.active){background:#E8F5E3;color:#243020}', 1)
          s=s.replace('.remove-line{border:0;background:#fff;color:#a33;font-size:20px;font-weight:900}', '.remove-line{border:1px solid #c98b8b;background:#fff;color:#9b2c2c;border-radius:6px;font-size:18px;font-weight:900;width:32px;height:32px}.remove-line:hover{background:#fff0f0;border-color:#9b2c2c}', 1)
          s=s.replace('.entry-head,.line{display:grid;grid-template-columns:1.15fr 1fr .75fr .9fr 1fr 42px;', '.entry-head,.line{display:grid;grid-template-columns:1.05fr 1.25fr 1fr .7fr .9fr 1fr 42px;', 1)
          s=s.replace('<span>Date</span><span>Day</span><span>Qty</span><span>Rate (₦)</span><span>Amount (₦)</span><span></span>', '<span>Date</span><span>Items</span><span>Day</span><span>Qty</span><span>Rate (₦)</span><span>Amount (₦)</span><span></span>', 1)

          # Manual row: add editable Items field; preserve existing values.
          old = "var day=r.date?new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}):'—';var amount=(Number(r.qty)||0)*(Number(r.rate)||0);div.innerHTML='<input type=\"date\" value=\"'+r.date+'\"><span class=\"auto-day\">'+day+'</span><input type=\"number\" min=\"0\" value=\"'+r.qty+'\" placeholder=\"0\"><input type=\"number\" min=\"0\" value=\"'+r.rate+'\" placeholder=\"0\"><span class=\"auto-amount\">'+money(amount)+'</span><button"
          new = "var day=r.date?new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}):'—';var amount=(Number(r.qty)||0)*(Number(r.rate)||0);div.innerHTML='<input type=\"date\" value=\"'+r.date+'\"><input type=\"text\" value=\"'+(r.item||'')+'\" placeholder=\"e.g. Staff meals\"><span class=\"auto-day\">'+day+'</span><input type=\"number\" min=\"0\" value=\"'+r.qty+'\" placeholder=\"0\"><input type=\"number\" min=\"0\" value=\"'+r.rate+'\" placeholder=\"0\"><span class=\"auto-amount\">'+money(amount)+'</span><button"
          if old not in s:
              raise SystemExit('Manual row template not found')
          s=s.replace(old,new,1)
          old2="var inputs=div.querySelectorAll('input');inputs[0].addEventListener('input',function(){r.date=this.value;renderRows()});inputs[1].addEventListener('input',function(){r.qty=this.value;renderRows()});inputs[2].addEventListener('input',function(){r.rate=this.value;renderRows()});"
          new2="var inputs=div.querySelectorAll('input');inputs[0].addEventListener('input',function(){r.date=this.value;renderRows()});inputs[1].addEventListener('input',function(){r.item=this.value});inputs[2].addEventListener('input',function(){r.qty=this.value;renderRows()});inputs[3].addEventListener('input',function(){r.rate=this.value;renderRows()});"
          if old2 not in s: raise SystemExit('Manual input handlers not found')
          s=s.replace(old2,new2,1)
          s=s.replace("rows.push({date:document.getElementById('invoiceDate').value,qty:0,rate:+document.getElementById('defaultRate').value||2500});", "rows.push({date:document.getElementById('invoiceDate').value,item:'',qty:0,rate:+document.getElementById('defaultRate').value||2500});", 1)
          s=s.replace("var it=rows.map(function(r){return {invoice_id:a.data.id,item_date:r.date,day_name:new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}),description:'Invoice item',quantity:+r.qty||0,rate:+r.rate||0}});", "var it=rows.map(function(r){return {invoice_id:a.data.id,item_date:r.date,day_name:new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}),description:r.item||'Invoice item',quantity:+r.qty||0,rate:+r.rate||0}});", 1)

          # Printed invoice: add Items column.
          s=s.replace('<th>Date</th><th>Day</th><th>Qty</th><th>Rate (₦)</th><th>Amount (₦)</th>', '<th>Date</th><th>Items</th><th>Day</th><th>Qty</th><th>Rate (₦)</th><th>Amount (₦)</th>', 1)
          s=s.replace("<td>'+new Date(x.item_date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})+'</td><td>'+x.day_name+'</td><td class=\"green-number\">", "<td>'+new Date(x.item_date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})+'</td><td>'+String(x.description||'Invoice item')+'</td><td>'+x.day_name+'</td><td class=\"green-number\">")
          s=s.replace('.invoice-ref .ref-week th:nth-child(1),.invoice-ref .ref-week td:nth-child(1){width:21%}.invoice-ref .ref-week th:nth-child(2),.invoice-ref .ref-week td:nth-child(2){width:22%}.invoice-ref .ref-week th:nth-child(3),.invoice-ref .ref-week td:nth-child(3){width:18%}.invoice-ref .ref-week th:nth-child(4),.invoice-ref .ref-week td:nth-child(4){width:20%}.invoice-ref .ref-week th:nth-child(5),.invoice-ref .ref-week td:nth-child(5){width:19%}', '.invoice-ref .ref-week th:nth-child(1),.invoice-ref .ref-week td:nth-child(1){width:17%}.invoice-ref .ref-week th:nth-child(2),.invoice-ref .ref-week td:nth-child(2){width:23%}.invoice-ref .ref-week th:nth-child(3),.invoice-ref .ref-week td:nth-child(3){width:16%}.invoice-ref .ref-week th:nth-child(4),.invoice-ref .ref-week td:nth-child(4){width:12%}.invoice-ref .ref-week th:nth-child(5),.invoice-ref .ref-week td:nth-child(5){width:16%}.invoice-ref .ref-week th:nth-child(6),.invoice-ref .ref-week td:nth-child(6){width:16%}', 1)
          s=s.replace('.invoice-ref .ref-week table{font-size:7pt}', '.invoice-ref .ref-week table{font-size:6.8pt}.invoice-ref .ref-week td:nth-child(2){word-break:break-word}', 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ux-items.yml
          git add index.html
          git commit -m "Improve interactive button contrast and add invoice items column"
          git push