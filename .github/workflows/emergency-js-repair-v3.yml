name: Emergency JS repair v3
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove broken legacy PDF code and close script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad="document.getElementById('downloadInvoice').addEventListener('click',async function(){"
          if bad in s:
              s=s.split(bad,1)[0]+'});</script></body></html>'
          elif 'var canvas=await window.html2canvas(clone' in s:
              s=s.split('var canvas=await window.html2canvas(clone',1)[0]+'});</script></body></html>'
          s=s.replace("if(e.target.id==='previewDownload')document.getElementById('downloadInvoice').click()", "if(e.target.id==='previewDownload')downloadVisiblePdf()")
          if 'async function downloadVisiblePdf()' not in s:
              needle="document.getElementById('printModal').addEventListener('click',function(e){"
              pdf=r'''async function downloadVisiblePdf(){var source=document.querySelector('#printContent .invoice-ref');var btn=document.getElementById('previewDownload');var num=(window.currentInvoiceNumber||'invoice').replace(/[^a-z0-9_-]/gi,'_');if(!source||!btn){alert('Invoice preview is not ready.');return}if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF engine did not load. Refresh the page and try again.');return}btn.disabled=true;btn.textContent='Preparing PDF…';try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});var pdf=new window.jspdf.jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});await pdf.html(source,{x:10,y:10,width:190,windowWidth:718,autoPaging:'text',margin:[10,10,10,10],html2canvas:{scale:1.5,useCORS:true,allowTaint:false,backgroundColor:'#fff',logging:false,scrollX:0,scrollY:0},callback:function(doc){doc.setProperties({title:'BHIVE Invoice '+num,author:'BHIVE Resource Intl LTD'});doc.save('BHIVE-'+num+'.pdf')}})}catch(err){console.error('PDF export error',err);alert('PDF could not be generated: '+(err.message||'Please try again.'))}finally{btn.disabled=false;btn.textContent='Download PDF'}};'''
              if needle not in s: raise SystemExit('print modal listener not found')
              s=s.replace(needle,pdf+needle,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+8
          b=s.index('</script>',a)
          Path('/tmp/app.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit fixed app and remove repair workflows
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/emergency-js-repair.yml .github/workflows/emergency-js-repair-v3.yml .github/workflows/repair-auth-buttons.yml .github/workflows/final-ux-pdf.yml .github/workflows/final-print-pdf-fix.yml .github/workflows/printable-preview-pdf.yml .github/workflows/ux-items.yml .github/workflows/fix-pdf-export-v2.yml .github/workflows/fix-ux-pdf.yml 2>/dev/null || true
          git commit -m "Repair application JavaScript and restore button interactions"
          git push