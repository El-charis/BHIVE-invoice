name: Improve invoice preview and PDF export
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final preview UX and PDF fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Cleaner preview sheet: controls belong to the invoice, not above it.
          s=s.replace('.toolbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:14px}', '.toolbar{display:none}.preview-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:18px 0 10px;padding:12px 0;border-top:1px solid #dfe6da}.preview-actions .btn{min-width:120px}.preview-actions .btn.primary{min-width:145px}', 1)

          # Add a dedicated action row immediately before payment accounts in the printed invoice.
          needle='<div class="ref-accounts"><div><b>Account Name: BHIVE Resource Intl LTD</b>'
          replacement='<div class="preview-actions" data-html2canvas-ignore="true"><button type="button" id="previewPrint" class="btn">Print / Preview</button><button type="button" id="previewDownload" class="btn primary">Download PDF</button><button type="button" id="previewClose" class="btn">Close</button></div><div class="ref-accounts"><div><b>Account Name: BHIVE Resource Intl LTD</b>'
          if needle not in s:
              raise SystemExit('Account section marker not found')
          s=s.replace(needle,replacement,1)

          # Remove the old top toolbar markup; the new action row is part of the invoice preview.
          old='<div class="toolbar"><button type="button" id="closePrint" class="btn">Close</button><button type="button" id="downloadInvoice" class="btn primary">Download PDF</button></div><div id="printContent"></div>'
          new='<div id="printContent"></div>'
          if old not in s:
              raise SystemExit('Old preview toolbar markup not found')
          s=s.replace(old,new,1)

          # Make the action row buttons work for dynamically generated invoice HTML.
          s=s.replace("document.getElementById('closePrint').addEventListener('click',function(){document.getElementById('printModal').classList.remove('open')});", "document.getElementById('printModal').addEventListener('click',function(e){if(e.target.id==='previewClose')document.getElementById('printModal').classList.remove('open');if(e.target.id==='previewPrint')window.print();if(e.target.id==='previewDownload')document.getElementById('downloadInvoice').click()});")

          # Keep a hidden compatibility trigger for existing code, but make it non-visual.
          s=s.replace("document.getElementById('downloadInvoice').addEventListener('click',async function(){", "document.getElementById('downloadInvoice').addEventListener('click',async function(){", 1)

          # Replace the off-screen clone exporter. The previous blank-PDF problem came from rendering a
          # clone positioned far outside the viewport. jsPDF's HTML renderer can render the live, visible
          # invoice directly and supports automatic pagination through html2canvas.
          marker="document.getElementById('downloadInvoice').addEventListener('click',async function(){"
          start=s.find(marker)
          if start<0: raise SystemExit('PDF handler not found')
          end=s.find("});", start)+3
          if end<=2: raise SystemExit('PDF handler end not found')
          new_handler=r'''document.getElementById('downloadInvoice').addEventListener('click',async function(){var source=document.querySelector('#printContent .invoice-ref');var num=(window.currentInvoiceNumber||'invoice').replace(/[^a-z0-9_-]/gi,'_');var btn=document.getElementById('previewDownload');if(!source){alert('Invoice preview is not ready. Please generate the invoice again.');return}if(!window.jspdf||!window.jspdf.jsPDF){alert('PDF engine did not load. Please refresh the page and try again.');return}var PDF=window.jspdf.jsPDF;btn.disabled=true;btn.textContent='Preparing PDF…';try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});var pdf=new PDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});await new Promise(function(resolve,reject){pdf.html(source,{x:10,y:10,width:190,windowWidth:718,autoPaging:'text',margin:[10,10,10,10],html2canvas:{scale:1.5,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',logging:false,scrollX:0,scrollY:0},callback:function(doc){try{doc.setProperties({title:'BHIVE Invoice '+num,author:'BHIVE Resource Intl LTD'});doc.save('BHIVE-'+num+'.pdf');resolve()}catch(e){reject(e)}}}).catch(reject)});}catch(err){console.error('PDF export error:',err);alert('PDF could not be generated. '+(err.message||'Please try again.'))}finally{btn.disabled=false;btn.textContent='Download PDF'}});'''
          s=s[:start]+new_handler+s[end:]

          # The preview itself remains the printable A4 sheet. Bottom controls are hidden when printing/exporting.
          s=s.replace('@media print{body>*:not(#printModal){display:none!important}', '@media print{body>*:not(#printModal){display:none!important}', 1)

          # Make the action row sit immediately above account details and visually separate the payment section.
          s=s.replace('.ref-accounts{display:grid;', '.ref-accounts{display:grid;', 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-ux-pdf.yml
          git add index.html
          git commit -m "Improve invoice preview actions and fix blank PDF export"
          git push