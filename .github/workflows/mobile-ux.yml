name: Improve mobile responsive UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile-first responsive layer
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="mobile-ux-fix">
          @media (max-width:800px){
            html,body{width:100%;max-width:100%;overflow-x:hidden}
            .auth{padding:16px;align-items:start;padding-top:28px}.auth-card{width:100%;padding:20px}.tabs{margin:16px 0}.tabs button{min-height:44px}
            .side{position:sticky;top:0;z-index:20;width:100%;padding:12px 12px 10px;border:0;border-bottom:1px solid var(--line);box-shadow:0 2px 12px #17300f0d}
            .brand{font-size:21px;margin:0 4px 10px}.nav{display:flex;gap:6px;margin:0;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;white-space:nowrap;padding:10px 13px;min-height:42px}.main{margin-left:0}.top{height:auto;min-height:58px;padding:10px 14px;gap:10px}.top .row{flex-wrap:wrap}.content{padding:12px}.card{padding:18px;border-radius:12px}.new-card{padding:16px}.form-section{padding:16px;margin-top:14px}.form-section-title{display:block;margin-bottom:14px}.form-section-title .btn{width:100%;margin-top:12px}.grid2{grid-template-columns:1fr;gap:4px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px}.stat strong{font-size:22px}.manual-title{display:block;margin:16px 0 10px}.manual-title .btn{width:100%;margin-top:12px}.entry-table{border-radius:10px;overflow:visible}.entry-head{display:none}.line{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px;border-top:1px solid #edf0eb}.line input,.line select{min-height:46px;padding:11px 12px;font-size:14px}.line input[type=date]{grid-column:1}.line input[type=text]{grid-column:2}.line select{grid-column:1}.line input[type=number]{grid-column:2}.line input[type=number]+input[type=number]{grid-column:1}.auto-amount{grid-column:2;align-self:center;padding:0 4px;font-size:14px}.remove-line{grid-column:1 / -1;justify-self:stretch;width:100%;height:42px}.entry-add{padding:12px;border-top:1px solid #e5ebe1}.entry-add .btn{width:100%;min-height:44px}.totals{max-width:none;margin:16px 0 0}.totals div{padding:7px 2px}.bank{font-size:15px;padding:13px;margin-top:16px;overflow-wrap:anywhere}.invoice-actions{display:grid;grid-template-columns:1fr;gap:9px}.invoice-actions .btn,.invoice-actions .primary{width:100%;min-width:0;min-height:46px}.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{min-width:620px}.modal{padding:0;align-items:stretch;justify-content:stretch;background:#172017aa}.sheet{width:100%;min-width:0;min-height:100dvh;max-height:none;height:100dvh;padding:12px;overflow:auto;border-radius:0;box-shadow:none}.preview-actions{position:sticky;bottom:0;background:#fff;z-index:3;display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin:12px 0 0;padding:10px 0 2px;border-top:1px solid #dfe6da}.preview-actions .btn{min-width:0;width:100%;min-height:44px;padding:9px 6px}.preview-actions .btn.primary{min-width:0}.invoice-ref{width:100%;min-width:0;font-size:8pt}.ref-top{grid-template-columns:1fr;gap:18px;margin-bottom:20px}.ref-right{text-align:left}.ref-word{font-size:24pt;margin-bottom:20px}.bill-label{width:100%;max-width:235px}.ref-meta{font-size:8pt}.ref-meta td{padding:11px 8px}.ref-week{margin-bottom:18px;padding-right:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.ref-week table{min-width:600px;font-size:7pt}.ref-summary{grid-template-columns:1fr}.summary-items{border-left:0;border-top:1px solid #aaa}.ref-accounts{grid-template-columns:1fr;font-size:9pt}.ref-accounts>div+div{border-left:0;border-top:2px solid #fff}.accounts{font-size:15px}.invoice-head{flex-direction:column;gap:12px}.invoice-head h1{font-size:25px}.sum{width:100%}
          }
          @media (max-width:420px){.stats{grid-template-columns:1fr}.content{padding:9px}.card{padding:14px}.new-card{padding:12px}.form-section{padding:13px}.line{grid-template-columns:1fr;gap:9px}.line input[type=date],.line input[type=text],.line select,.line input[type=number],.line input[type=number]+input[type=number],.auto-amount,.remove-line{grid-column:1}.ref-week table{min-width:560px}.preview-actions{grid-template-columns:1fr}.ref-logo{font-size:27pt}}
          </style>'''
          if 'id="mobile-ux-fix"' not in s:
              s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-ux.yml
          git add index.html
          git commit -m "Make invoice portal mobile friendly"
          git push