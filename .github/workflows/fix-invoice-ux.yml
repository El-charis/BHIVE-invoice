name: Fix invoice UX and rendering
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply invoice UX fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Better New Invoice spacing and hierarchy.
          s=s.replace('.content{padding:26px}', '.content{padding:32px}.new-card{padding:30px 32px}.form-section{background:#fbfcfa;border:1px solid #e5ebe1;border-radius:12px;padding:20px 22px;margin-top:20px}.form-section:first-of-type{margin-top:16px}.form-section-title{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:14px}.form-section-title h3{margin:0;font-size:16px}.form-section-title p{margin:4px 0 0}.invoice-actions{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-top:24px;padding-top:18px;border-top:1px solid #dfe6da}.invoice-actions .btn{min-width:120px}.invoice-actions .primary{min-width:155px}')

          # Prevent the right-most Amount border from falling outside the printable content box.
          s=s.replace('.invoice-ref table{width:100%;max-width:100%;', '.invoice-ref table{width:calc(100% - 1px);max-width:calc(100% - 1px);')
          s=s.replace('.invoice-ref .ref-week th:nth-child(6),.invoice-ref .ref-week td:nth-child(6){width:19%}', '.invoice-ref .ref-week th:nth-child(6),.invoice-ref .ref-week td:nth-child(6){width:19%;padding-right:8px}')
          s=s.replace('.ref-week{margin-bottom:27px;', '.ref-week{margin-bottom:27px;padding-right:1px;')

          # Make preview action hierarchy clearer: Preview is primary, Download is secondary, Close is quiet.
          s=s.replace('.preview-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:18px 0 10px;padding:12px 0;border-top:1px solid #dfe6da}', '.preview-actions{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin:18px 0 10px;padding:14px 0;border-top:1px solid #dfe6da}.preview-actions .btn{min-width:112px}.preview-actions .btn.primary{min-width:125px}')

          # Replace the New Invoice header/action markup with a clearer workflow.
          old='<section id="new" class="page"><div class="card"><h2>New Invoice</h2><div class="grid2"><div><label>Invoice date</label><input id="invoiceDate" type="date"><label>Client / Bill To</label><input id="clientName" placeholder="Client name"><label>Client address</label><textarea id="clientAddress" rows="2"></textarea></div><div><label>Default rate</label><input id="defaultRate" type="number" value="2500"><label>Notes</label><textarea id="invoiceNotes" rows="2"></textarea></div></div><div class="manual-title"><div><h3>Manual entry</h3><p class="muted">Add each day as a line. The day and amount are calculated automatically, and the invoice groups dates into Monday–Sunday weeks.</p></div><button type="button" id="addLine" class="btn primary">+ Add day</button></div>'
          new='<section id="new" class="page"><div class="card new-card"><div class="form-section-title"><div><div class="eyebrow">Create invoice</div><h2 style="margin:4px 0 0">New Invoice</h2><p class="muted">Enter the invoice details first, then add the daily entries below.</p></div></div><div class="form-section"><div class="form-section-title"><div><h3>Invoice details</h3><p class="muted">Basic information for this invoice.</p></div></div><div class="grid2"><div><label>Invoice date</label><input id="invoiceDate" type="date"><label>Client / Bill To</label><input id="clientName" placeholder="Client name"><label>Client address</label><textarea id="clientAddress" rows="2" placeholder="Client address"></textarea></div><div><label>Default rate</label><input id="defaultRate" type="number" value="2500"><label>Notes</label><textarea id="invoiceNotes" rows="2" placeholder="Optional note"></textarea></div></div></div><div class="form-section"><div class="form-section-title"><div><h3>Manual entry</h3><p class="muted">Choose the actual date for each entry. The weekday and amount update automatically, and dates are grouped into Monday–Sunday weeks.</p></div><button type="button" id="addLine" class="btn primary">+ Add day</button></div>'
          if old not in s: raise SystemExit('New Invoice markup not found')
          s=s.replace(old,new,1)

          # Close the new manual-entry section after the entry table/totals/bank area.
          s=s.replace('<div class="bank"><b>Account Name:', '<div class="bank"><b>Account Name:',1)
          s=s.replace('</div><div class="row" style="margin-top:18px"><button type="button" id="saveInvoice" class="btn primary">Save & Download PDF</button><button type="button" id="clearInvoice" class="btn">Clear</button></div><div id="invoiceMsg" class="msg"></div></div></section>', '</div><div class="invoice-actions"><button type="button" id="previewDraft" class="btn">Preview</button><button type="button" id="clearInvoice" class="btn">Clear</button><button type="button" id="saveInvoice" class="btn primary">Save Invoice</button></div><div id="invoiceMsg" class="msg"></div></div></section>',1)

          # Explicit date parsing fixes the weekday; it no longer depends on the browser timezone.
          old_week="function week(date){var d=new Date(date+'T00:00:00');var day=d.getDay();var monday=new Date(d);monday.setDate(d.getDate()-(day===0?6:day-1));var sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return{start:monday.toISOString().slice(0,10),end:sunday.toISOString().slice(0,10)}}"
          new_week="function parseDate(date){var p=String(date||'').split('-').map(Number);return p.length===3&&p.every(Number.isFinite)?new Date(Date.UTC(p[0],p[1]-1,p[2])):null}function weekday(date){var d=parseDate(date);return d?['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getUTCDay()]:'—'}function week(date){var d=parseDate(date);if(!d)return{start:'',end:''};var day=d.getUTCDay();var monday=new Date(d);monday.setUTCDate(d.getUTCDate()-(day===0?6:day-1));var sunday=new Date(monday);sunday.setUTCDate(monday.getUTCDate()+6);return{start:monday.toISOString().slice(0,10),end:sunday.toISOString().slice(0,10)}}"
          if old_week not in s: raise SystemExit('week function not found')
          s=s.replace(old_week,new_week,1)

          # Use the explicit weekday helper in the manual table and generated invoice.
          s=s.replace("var day=r.date?new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}):'—';", "var day=weekday(r.date);")
          s=s.replace("day_name:new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'})", "day_name:weekday(r.date)")

          # Do not force every new manual row to Monday/current date. A new row starts blank so the user selects the real date.
          s=s.replace("function addRow(){rows.push({date:document.getElementById('invoiceDate').value||new Date().toISOString().slice(0,10),qty:0,rate:Number(document.getElementById('defaultRate').value)||2500});renderRows()}", "function addRow(){rows.push({date:'',qty:0,rate:Number(document.getElementById('defaultRate').value)||2500});renderRows()}")
          s=s.replace("var items=rows.map(function(r){var w=week(r.date);return{invoice_id:inv.data.id", "if(rows.some(function(r){return !r.date})){throw new Error('Select a date for every manual entry before saving.')}var items=rows.map(function(r){var w=week(r.date);return{invoice_id:inv.data.id")

          # Add a draft Preview button without saving; it uses the same invoice renderer with temporary values.
          marker="document.getElementById('saveInvoice').addEventListener('click',saveInvoice);"
          preview="document.getElementById('saveInvoice').addEventListener('click',saveInvoice);document.getElementById('previewDraft').addEventListener('click',function(){var name=document.getElementById('clientName').value.trim();if(!name){document.getElementById('invoiceMsg').textContent='Enter a client name before previewing.';return}var date=document.getElementById('invoiceDate').value||new Date().toISOString().slice(0,10);var subtotal=rows.reduce(function(s,r){return s+(Number(r.qty)||0)*(Number(r.rate)||0)},0);var vat=subtotal*.075;showPrint({invoice_number:'DRAFT',client_name:name,client_address:document.getElementById('clientAddress').value,invoice_date:date,subtotal:subtotal,vat_amount:vat,total_amount:subtotal+vat},rows.map(function(r){var w=week(r.date||date);return{item_date:r.date||date,day_name:weekday(r.date||date),description:r.item||'Invoice item',quantity:Number(r.qty)||0,rate:Number(r.rate)||0,week_start:w.start,week_end:w.end}}))});"
          if marker not in s: raise SystemExit('save listener not found')
          s=s.replace(marker,preview,1)

          # Preview/close/download are already delegated from the modal; make Close available via Escape too.
          s=s.replace("document.getElementById('printModal').addEventListener('click',function(e){", "document.addEventListener('keydown',function(e){if(e.key==='Escape')document.getElementById('printModal').classList.remove('open')});document.getElementById('printModal').addEventListener('click',function(e){",1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script></body>',s,re.S).group(1)
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-invoice-ux.yml
          git add index.html
          git commit -m "Improve invoice entry UX and fix weekday and table borders"
          git push