name: Stabilize mobile layout
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final clean mobile layout
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''<style id="mobile-clean-layout">
          @media (max-width:800px){
            html,body{width:100%;max-width:100%;overflow-x:hidden}
            body{background:#f5f7f3}
            .side{position:sticky!important;inset:auto!important;top:0!important;width:100%!important;height:auto!important;padding:12px 16px 10px!important;background:#fff!important;border:0!important;border-bottom:1px solid #dfe6da!important;z-index:100!important;box-shadow:0 3px 14px #17300f0b!important}
            .brand{font-size:21px!important;margin:0 0 10px!important}
            .nav{display:flex!important;gap:7px!important;margin:0!important;overflow-x:auto!important;padding:0!important;scrollbar-width:none!important}
            .nav button{flex:0 0 auto!important;width:auto!important;min-height:42px!important;padding:10px 14px!important;border-radius:10px!important;white-space:nowrap!important}
            .main{margin-left:0!important;min-width:0!important}
            .top{position:relative!important;top:auto!important;height:auto!important;min-height:58px!important;padding:12px 16px!important;flex-wrap:wrap!important;gap:8px!important}
            .content{width:100%!important;max-width:100%!important;padding:16px 16px 28px!important}
            .card,.new-card{width:100%!important;max-width:100%!important;min-width:0!important;padding:18px!important;border-radius:14px!important}
            .form-section{width:100%!important;min-width:0!important;padding:16px!important;margin-top:14px!important;border-radius:13px!important;overflow:visible!important}
            .form-section-title{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;margin-bottom:14px!important}
            .form-section-title>div{min-width:0!important;flex:1 1 auto!important}.form-section-title .btn{flex:0 0 auto!important;width:auto!important;min-height:42px!important;margin:0!important;white-space:nowrap!important}
            .grid2{display:grid!important;grid-template-columns:1fr!important;gap:0!important}
            label{font-size:11px!important;margin:13px 0 6px!important}
            input,textarea,select{width:100%!important;min-width:0!important;min-height:46px!important;padding:11px 12px!important;font-size:15px!important;border-radius:9px!important}
            input::placeholder,textarea::placeholder{color:#8a9486!important;opacity:1!important}
            .invoice-actions{position:static!important;width:100%!important;display:grid!important;grid-template-columns:1fr 1fr!important;gap:9px!important;margin-top:20px!important;padding:16px 0 0!important;border-top:1px solid #dfe6da!important;background:transparent!important;box-shadow:none!important;backdrop-filter:none!important}
            .invoice-actions .btn,.invoice-actions .primary{width:100%!important;min-width:0!important;min-height:47px!important;padding:11px 10px!important;border-radius:10px!important}
            .invoice-actions .primary{grid-column:1/-1!important;order:-1!important}
            .manual-title{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;margin:20px 0 12px!important}
            .manual-title>div:first-child{min-width:0!important}.manual-title .btn{width:auto!important;min-width:110px!important;min-height:43px!important;margin:0!important;white-space:nowrap!important}
            .entry-table{width:100%!important;max-width:100%!important;overflow:visible!important;border:0!important;background:transparent!important}
            .entry-head{display:none!important}
            .manual-entry-wrap{padding:0!important}
            .line{width:100%!important;display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:9px!important;margin:0 0 10px!important;padding:14px!important;border:1px solid #e1e8dd!important;border-radius:13px!important;background:#fff!important;box-shadow:0 3px 12px #17300f08!important;align-items:center!important}
            .line>*{min-width:0!important}
            .line input,.line select{width:100%!important;margin:0!important;min-height:45px!important;padding:10px 11px!important}
            .line .auto-day,.line .auto-amount{width:100%!important;min-height:45px!important;display:flex!important;align-items:center!important;padding:10px 11px!important;border:1px solid #e1e8dd!important;border-radius:9px!important;background:#f7f9f5!important;box-sizing:border-box!important;overflow:hidden!important;white-space:nowrap!important}
            .line .auto-amount{justify-content:flex-end!important;color:#172017!important;font-weight:800!important}
            .line .remove-line{grid-column:1/-1!important;justify-self:stretch!important;width:100%!important;height:40px!important;margin-top:1px!important}
            .entry-add{padding:2px 0 0!important;border:0!important}.entry-add .btn{width:100%!important;min-height:45px!important}
            .totals{width:100%!important;max-width:none!important;margin:16px 0 0!important}
            .bank{width:100%!important;overflow-wrap:anywhere!important}
            .stats{display:grid!important;grid-template-columns:1fr 1fr!important;gap:10px!important}.stat{min-width:0!important;padding:14px!important}
            .tablewrap{width:100%!important;max-width:100%!important;overflow-x:auto!important}
            .table{min-width:620px!important}
            .modal{z-index:1000!important}
          }
          @media(max-width:430px){
            .content{padding-left:13px!important;padding-right:13px!important}
            .card,.new-card{padding:15px!important}.form-section{padding:14px!important}
            .form-section-title{align-items:flex-start!important}.form-section-title .btn{min-width:100px!important;padding-left:10px!important;padding-right:10px!important}
            .line{grid-template-columns:1fr 1fr!important;padding:12px!important;gap:8px!important}
            .line input,.line select,.line .auto-day,.line .auto-amount{font-size:13px!important}
            .invoice-actions{grid-template-columns:1fr 1fr!important}.invoice-actions .primary{grid-column:1/-1!important}
          }
          </style>'''
          if 'id="mobile-clean-layout"' in s:
              raise SystemExit('clean mobile layer already exists')
          s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/app.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-cleanup.yml
          git add index.html
          git commit -m "Fix mobile stacking and stabilize responsive layout"
          git push