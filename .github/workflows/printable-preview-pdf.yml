name: Make invoice preview printable and fix PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply printable preview and reliable PDF export
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Add dedicated rendering libraries. Keep html2pdf loaded for compatibility, but export with canvas+jsPDF.
          s=s.replace('<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>', '<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>', 1)
          # Preview is an actual A4 sheet: 210mm x 297mm, with 10mm printable margins.
          s=s.replace('.sheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;padding:30px}', '.sheet{background:#fff;width:210mm;min-height:297mm;max-height:92vh;overflow:auto;padding:10mm;box-sizing:border-box;box-shadow:0 12px 40px #0002}', 1)
          s=s.replace('.invoice-ref{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:#000;font-size:9pt;background:#fff;width:178mm;max-width:178mm;margin:0 auto;padding:0;box-sizing:border-box;overflow:visible}', '.invoice-ref{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:#000;font-size:9pt;background:#fff;width:190mm;max-width:190mm;margin:0;padding:0;box-sizing:border-box;overflow:visible}', 1)
          # Make every table fit exactly inside the printable width and keep the final Amount border visible.
          s=s.replace('.invoice-ref table{width:100%;max-width:100%;border-collapse:collapse;border-spacing:0;table-layout:fixed}', '.invoice-ref table{width:190mm;max-width:190mm;border-collapse:collapse;border-spacing:0;table-layout:fixed;box-sizing:border-box}', 1)
          s=s.replace('.invoice-ref .ref-week td{border:1px solid #777!important;padding:6px 8px;height:18px;box-sizing:border-box}', '.invoice-ref .ref-week th,.invoice-ref .ref-week td{box-sizing:border-box;overflow:hidden}.invoice-ref .ref-week td{border:1px solid #777!important;padding:6px 7px;height:18px}', 1)
          s=s.replace('.invoice-ref .ref-week th:nth-child(1),.invoice-ref .ref-week td:nth-child(1){width:17%}.invoice-ref .ref-week th:nth-child(2),.invoice-ref .ref-week td:nth-child(2){width:23%}.invoice-ref .ref-week th:nth-child(3),.invoice-ref .ref-week td:nth-child(3){width:16%}.invoice-ref .ref-week th:nth-child(4),.invoice-ref .ref-week td:nth-child(4){width:12%}.invoice-ref .ref-week th:nth-child(5),.invoice-ref .ref-week td:nth-child(5){width:16%}.invoice-ref .ref-week th:nth-child(6),.invoice-ref .ref-week td:nth-child(6){width:16%}', '.invoice-ref .ref-week th:nth-child(1),.invoice-ref .ref-week td:nth-child(1){width:16%}.invoice-ref .ref-week th:nth-child(2),.invoice-ref .ref-week td:nth-child(2){width:22%}.invoice-ref .ref-week th:nth-child(3),.invoice-ref .ref-week td:nth-child(3){width:15%}.invoice-ref .ref-week th:nth-child(4),.invoice-ref .ref-week td:nth-child(4){width:11%}.invoice-ref .ref-week th:nth-child(5),.invoice-ref .ref-week td:nth-child(5){width:17%}.invoice-ref .ref-week th:nth-child(6),.invoice-ref .ref-week td:nth-child(6){width:19%}', 1)
          # Replace html2pdf export with a direct canvas -> A4 PDF pipeline.
          old_start="document.getElementById('downloadInvoice').addEventListener('click',async function(){"
          start=s.find(old_start)
          if start<0: raise SystemExit('PDF handler start not found')
          end=s.find("});async function downloadExisting", start)
          if end<0: raise SystemExit('PDF handler end not found')
          new=r'''document.getElementById('downloadInvoice').addEventListener('click',async function(){var el=document.getElementById('printContent');var num=(window.currentInvoiceNumber||'invoice').replace(/[^a-z0-9_-]/gi,'_');var btn=document.getElementById('downloadInvoice');btn.disabled=true;btn.textContent='Preparing PDF…';try{document.getElementById('printModal').classList.add('open');await new Promise(function(r){requestAnimationFrame(function(){requestAnimationFrame(r)})});if(document.fonts&&document.fonts.ready)await document.fonts.ready;var canvas=await window.html2canvas(el,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#fff',logging:false,scrollX:0,scrollY:0});if(!canvas.width||!canvas.height)throw new Error('Invoice could not be rendered');var js=window.jspdf&&window.jspdf.jsPDF;if(!js)throw new Error('PDF engine did not load');var pdf=new js({unit:'mm',format:'a4',orientation:'portrait',compress:true});var pageW=210,pageH=297,margin=10,usableW=pageW-margin*2,usableH=pageH-margin*2;var pxPerMm=canvas.width/190;var pagePx=Math.floor(usableH*pxPerMm);var pages=Math.ceil(canvas.height/pagePx);for(var i=0;i<pages;i++){if(i>0)pdf.addPage();var slice=document.createElement('canvas');slice.width=canvas.width;slice.height=Math.min(pagePx,canvas.height-i*pagePx);var ctx=slice.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,slice.width,slice.height);ctx.drawImage(canvas,0,i*pagePx,canvas.width,slice.height,0,0,slice.width,slice.height);var h=(slice.height/canvas.width)*usableW;pdf.addImage(slice.toDataURL('image/jpeg',0.98),'JPEG',margin,margin,usableW,h,undefined,'FAST')}pdf.setProperties({title:'BHIVE Invoice '+num,author:'BHIVE Resource Intl LTD'});pdf.save('BHIVE-'+num+'.pdf')}catch(err){console.error(err);alert('PDF could not be generated: '+(err.message||'Please try again.'))}finally{btn.disabled=false;btn.textContent='Download PDF'}});'''
          s=s[:start]+new+s[end:]
          # Print should be exactly the same A4 sheet, not a separate compressed layout.
          s=s.replace('@media print{body>*:not(#printModal){display:none!important}.modal{position:static;display:block;background:#fff;padding:0}.sheet{width:100%;max-height:none;box-shadow:none;padding:0}', '@media print{body>*:not(#printModal){display:none!important}.modal{position:static;display:block;background:#fff;padding:0}.sheet{width:210mm;min-height:297mm;max-height:none;overflow:visible;box-shadow:none;padding:10mm}', 1)
          # Responsive fallback for small screens while preserving the A4 canvas dimensions used for export.
          s=s.replace('@media(max-width:800px){', '@media(max-width:800px){.sheet{width:210mm;min-width:210mm}.modal{justify-content:flex-start;overflow:auto}.invoice-ref{width:190mm;min-width:190mm}', 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/printable-preview-pdf.yml
          git add index.html
          git commit -m "Make invoice preview true A4 and fix PDF export"
          git push