name: Fix invoice UX and PDF alignment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UX and PDF fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Strong interactive green for primary actions; light green only for subtle backgrounds.
          s=s.replace('--green:#A8EB85;', '--green:#58A83D;', 1)
          s=s.replace('.primary{background:var(--green);color:#fff;border-color:var(--green)}', '.primary{background:#58A83D;color:#fff;border:1px solid #58A83D;box-shadow:none}.primary:hover{background:#4A9633;border-color:#4A9633}.primary:active{background:#3F812B;border-color:#3F812B;transform:translateY(1px)}.primary:disabled{background:#A9B8A3;border-color:#A9B8A3;cursor:not-allowed;opacity:1}', 1)
          # Make tabs clearly communicate the active state.
          s=s.replace('.tabs button.active{background:#fff;color:#315323;box-shadow:0 1px 5px #0001}', '.tabs button.active{background:#58A83D;color:#fff;box-shadow:0 2px 7px #58A83D44}', 1)
          # Sidebar active state should be visibly stronger too.
          s=s.replace('.nav button.active,.nav button:hover{background:#eaf6e3;color:#315323}', '.nav button.active{background:#58A83D;color:#fff}.nav button:hover{background:#eaf6e3;color:#315323}', 1)
          # PDF content must have an explicit A4-safe width and no negative/overflowing canvas.
          s=s.replace('.invoice-ref{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:#000;font-size:9pt;background:#fff}', '.invoice-ref{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:#000;font-size:9pt;background:#fff;width:190mm;max-width:190mm;margin:0 auto;padding:0;box-sizing:border-box;overflow:hidden}', 1)
          # Keep all invoice tables inside the A4-safe content width.
          s=s.replace('.invoice-ref table{width:100%;border-collapse:collapse;table-layout:fixed}', '.invoice-ref table{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed}', 1)
          # Account block should use the reference's light green rather than the strong action green.
          s=s.replace('.accounts{margin-top:22px;background:#70AD47;color:#111;border:2px solid #70AD47;', '.accounts{margin-top:22px;background:#D4F5C3;color:#111;border:1px solid #58A83D;', 1)
          # Make the PDF generator use the same A4-safe width and margins.
          s=s.replace("margin:[8,8,8,8],filename:'BHIVE-'+num+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}", "margin:[7,7,7,7],filename:'BHIVE-'+num+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:1.5,useCORS:true,backgroundColor:'#ffffff',width:718,windowWidth:718},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}", 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-ux-pdf.yml
          git add index.html
          git commit -m "Improve button states and fix PDF A4 alignment"
          git push