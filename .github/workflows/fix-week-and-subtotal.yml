name: Fix subtotal alignment
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix six-column subtotal row
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="html+='<tr class=\"ref-subtotal\"><td>Subtotal</td><td></td><td>'+list.reduce(function(a,x){return a+(Number(x.quantity)||0)},0)+'</td><td></td><td>₦'+subtotal.toLocaleString('en-NG',{maximumFractionDigits:2})+'</td></tr></tbody></table></div>';"
          new="html+='<tr class=\"ref-subtotal\"><td>Subtotal</td><td></td><td></td><td>'+list.reduce(function(a,x){return a+(Number(x.quantity)||0)},0)+'</td><td></td><td>₦'+subtotal.toLocaleString('en-NG',{maximumFractionDigits:2})+'</td></tr></tbody></table></div>';"
          if old not in s:
              raise SystemExit('Expected subtotal markup was not found')
          s=s.replace(old,new,1)
          # The output table should use its full available width so the right edge
          # and Amount column are not shortened by the previous 1px workaround.
          s=s.replace('.invoice-ref table{width:calc(100% - 1px);max-width:calc(100% - 1px);', '.invoice-ref table{width:100%!important;max-width:100%!important;')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js=re.search(r'<script>(.*)</script></body>',s,re.S).group(1)
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-week-and-subtotal.yml
          git commit -m "Fix subtotal alignment and full amount border"
          git push