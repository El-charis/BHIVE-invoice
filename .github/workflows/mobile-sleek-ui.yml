name: Sleek mobile invoice UX
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply mobile UI and preserve invoice preview design
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=r'''<style id="mobile-sleek-ui">
          @media (max-width:800px){
            :root{--mobile-gutter:16px;--mobile-radius:16px}
            html,body{width:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
            body{background:#f4f7f2}
            .main{margin-left:0;min-height:100vh}
            .side{position:sticky;top:0;z-index:40;width:100%;height:auto;padding:12px var(--mobile-gutter) 10px;background:rgba(255,255,255,.97);border:0;border-bottom:1px solid #e3e9df;box-shadow:0 3px 18px #17300f0b;backdrop-filter:blur(10px)}
            .brand{font-size:22px;line-height:1;margin:2px 0 10px 2px}
            .nav{display:flex;gap:7px;margin:0;overflow-x:auto;padding:0 0 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.nav::-webkit-scrollbar{display:none}.nav button{flex:0 0 auto;padding:10px 14px;min-height:42px;border:1px solid transparent;border-radius:10px;font-size:13px}.nav button.active{box-shadow:none}
            .top{position:sticky;top:78px;z-index:30;height:auto;min-height:56px;padding:11px var(--mobile-gutter);border-bottom:1px solid #e3e9df}.top .row{gap:7px;flex-wrap:wrap}
            .content{padding:12px var(--mobile-gutter) 92px}
            .card{padding:18px;border-radius:var(--mobile-radius);box-shadow:0 7px 24px #17300f0a}
            .new-card{padding:14px}
            .form-section{padding:16px;border-radius:14px;margin-top:12px;background:#fff}.form-section:first-of-type{margin-top:4px}.form-section-title{display:block;margin-bottom:12px}.form-section-title h3{font-size:15px}.form-section-title p{font-size:12px;line-height:1.5}.form-section-title .btn{width:100%;margin-top:12px}
            .grid2{grid-template-columns:1fr;gap:0}.grid2>div{min-width:0}
            label{font-size:11px;margin:13px 0 6px}input,textarea{min-height:46px;padding:11px 12px;font-size:15px;border-radius:10px}
            .invoice-actions{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px;margin:0;padding:10px max(var(--mobile-gutter),env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom));border-top:1px solid #dfe6da;box-shadow:0 -6px 22px #17300f12}.invoice-actions .btn,.invoice-actions .primary{width:100%;min-width:0;min-height:46px;padding:10px 8px;border-radius:10px}
            .entry-table{border:0;border-radius:0;background:transparent;overflow:visible}.entry-head{display:none}.line{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:14px 0;margin:0;border:0;border-bottom:1px solid #e6ece2;background:#fff;border-radius:12px;margin-bottom:9px;padding:14px}.line input,.line select{min-height:44px;padding:10px 11px;border-radius:9px;font-size:14px}.line input[type=date]{grid-column:1}.line input[type=text]{grid-column:2}.line select{grid-column:1}.line input[type=number]{grid-column:2}.line input[type=number]+input[type=number]{grid-column:1}.auto-amount{grid-column:2;align-self:center;font-size:14px;padding:0 3px}.remove-line{grid-column:1 / -1;justify-self:stretch;width:100%;height:40px;border-radius:9px}.entry-add{padding:0 0 4px;border:0}.entry-add .btn{width:100%;min-height:44px;border-radius:10px}
            .totals{max-width:none;margin:14px 0 0}.totals div{padding:7px 0}.bank{font-size:14px;line-height:1.65;border-radius:12px;padding:14px;margin-top:14px;overflow-wrap:anywhere}
            .stats{grid-template-columns:1fr 1fr;gap:9px}.stat{padding:14px;border-radius:12px}.stat strong{font-size:22px}
            .tablewrap{margin:0 -2px;border-radius:10px}.table{min-width:620px}
            /* Invoice preview: preserve the exact A4 invoice design. Never reflow its columns on mobile. */
            .modal{padding:0;align-items:flex-start;justify-content:flex-start;background:#172017b8;overflow:auto}.sheet{width:100%;min-width:0;min-height:100dvh;height:auto;max-height:none;padding:10px;background:#f3f5f1;overflow:auto;border-radius:0;box-shadow:none}.sheet .preview-actions{position:sticky;top:0;z-index:8;margin:0 -10px 10px;padding:9px 10px;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);border-top:0;border-bottom:1px solid #dfe6da}.preview-actions{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:7px}.preview-actions .btn,.preview-actions .btn.primary{width:100%;min-width:0;min-height:42px;padding:8px 5px;border-radius:9px;font-size:12px}
            .invoice-ref{width:190mm!important;min-width:190mm!important;max-width:190mm!important;margin:0 auto;background:#fff;box-shadow:0 4px 18px #00000014;transform-origin:top left}
            .mobile-invoice-stage{width:100%;overflow:hidden;background:#f3f5f1}
            .ref-top{grid-template-columns:1fr 1fr;gap:35px}.ref-right{text-align:right}.ref-word{font-size:29pt}.ref-meta td{padding:18px 10px}.ref-week{overflow:visible}.ref-week table{min-width:0!important}.ref-summary{grid-template-columns:1fr 1.25fr}.ref-accounts{grid-template-columns:1fr 1fr}
          }
          @media(max-width:430px){
            .content{padding-left:12px;padding-right:12px}.new-card{padding:11px}.form-section{padding:14px}.stats{grid-template-columns:1fr 1fr}.stat strong{font-size:20px}.line{grid-template-columns:1fr;gap:8px}.line input[type=date],.line input[type=text],.line select,.line input[type=number],.line input[type=number]+input[type=number],.auto-amount,.remove-line{grid-column:1}.invoice-actions{grid-template-columns:1fr 1fr 1.3fr;padding-left:12px;padding-right:12px}.preview-actions{grid-template-columns:1fr 1fr 1.2fr}.preview-actions .btn{font-size:11px}
          }
          </style>
          <script>
          (function(){
            function fitMobileInvoice(){
              if(window.innerWidth>800)return;
              var sheet=document.querySelector('#printModal .sheet'), inv=document.querySelector('#printModal .invoice-ref');
              if(!sheet||!inv)return;
              var available=Math.max(280,sheet.clientWidth-20), target=inv.offsetWidth;
              var scale=Math.min(1,available/target);
              inv.style.transform='scale('+scale+')';
              inv.style.transformOrigin='top left';
              inv.style.marginLeft=Math.max(0,(available-target*scale)/2)+'px';
              inv.style.marginRight='0';
              var h=inv.scrollHeight*scale;
              inv.parentElement.style.height=h+'px';
            }
            window.addEventListener('resize',function(){requestAnimationFrame(fitMobileInvoice)});
            document.addEventListener('click',function(e){if(e.target.closest('#previewDownload')||e.target.closest('#printModal')||e.target.closest('#previewDraft'))setTimeout(fitMobileInvoice,80)});
            var observer=new MutationObserver(function(){setTimeout(fitMobileInvoice,40)});
            observer.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});
          })();
          </script>'''
          if 'id="mobile-sleek-ui"' in s: raise SystemExit('mobile sleek layer already exists')
          s=s.replace('</head>',patch+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mobile-sleek-ui.yml
          git add index.html
          git commit -m "Redesign mobile UI and preserve invoice preview layout"
          git push