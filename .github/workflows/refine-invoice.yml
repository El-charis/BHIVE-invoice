name: Update BHIVE invoice UX and PDF
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply invoice updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>', '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>',1)
          s=s.replace('--green:#70AD47;--light:#D4F5C3;--blue:#D9E2F3;', '--green:#A8EB85;--light:#D4F5C3;--blue:#D2D9EB;',1)
          s=s.replace('<div class="toolbar"><button type="button" id="closePrint" class="btn">Close</button><button type="button" id="printInvoice" class="btn primary">Print invoice</button></div>','<div class="toolbar"><button type="button" id="closePrint" class="btn">Close</button><button type="button" id="downloadInvoice" class="btn primary">Download PDF</button></div>',1)
          s=s.replace('<h3>Manual entry</h3><p class="muted">Enter actual calendar dates. A new week table is created automatically whenever the date moves into another Monday–Sunday week.</p><div id="invoiceLines"></div><button type="button" id="addLine" class="btn">+ Add line</button>','<div class="manual-title"><div><h3>Manual entry</h3><p class="muted">Add each day as a line. The day and amount are calculated automatically, and the invoice groups dates into Monday–Sunday weeks.</p></div><button type="button" id="addLine" class="btn primary">+ Add day</button></div><div class="entry-table"><div class="entry-head"><span>Date</span><span>Day</span><span>Qty</span><span>Rate (₦)</span><span>Amount (₦)</span><span></span></div><div id="invoiceLines"></div></div>',1)
          s=s.replace('Save & Preview Invoice','Save & Download PDF',1)
          s=re.sub(r'function renderRows\(\)\{.*?\}function addRow\(\)', r'''function renderRows(){var box=document.getElementById('invoiceLines');box.innerHTML='';rows.forEach(function(r,i){var div=document.createElement('div');div.className='line';var day=r.date?new Date(r.date+'T00:00:00').toLocaleDateString('en-US',{weekday:'long'}):'—';var amount=(Number(r.qty)||0)*(Number(r.rate)||0);div.innerHTML='<input type="date" value="'+r.date+'"><span class="auto-day">'+day+'</span><input type="number" min="0" value="'+r.qty+'" placeholder="0"><input type="number" min="0" value="'+r.rate+'" placeholder="0"><span class="auto-amount">'+money(amount)+'</span><button type="button" class="remove-line" aria-label="Remove line">×</button>';var inputs=div.querySelectorAll('input');inputs[0].addEventListener('input',function(){r.date=this.value;renderRows()});inputs[1].addEventListener('input',function(){r.qty=this.value;renderRows()});inputs[2].addEventListener('input',function(){r.rate=this.value;renderRows()});div.querySelector('button').addEventListener('click',function(){rows.splice(i,1);renderRows()});box.appendChild(div)});calc()}function addRow()''', s, count=1, flags=re.S)
          start=s.index('function showPrint(inv,items){')
          end=s.index("document.getElementById('closePrint')", start)
          new_show=r'''function showPrint(inv,items){var groups={};items.slice().sort(function(a,b){return a.item_date.localeCompare(b.item_date)}).forEach(function(x){var key=x.week_start+'|'+x.week_end;if(!groups[key])groups[key]=[];groups[key].push(x)});function pretty(d){return new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'})}var html='<div class="invoice-ref"><div class="ref-top"><div class="ref-brand"><div class="ref-logo">BHIVE</div><div class="ref-address">B Abayomi Shonuga street<br>Off Fola Osibo<br>Lekki Lagos 101223<br>+234 810 939 8950<br>+234 810 939 8950</div><div class="bill-label">BILL TO</div><div class="bill-name">'+String(inv.client_name||'')+(inv.client_address?'<br><span>'+String(inv.client_address)+'</span>':'')+'</div></div><div class="ref-right"><div class="ref-word">INVOICE</div><table class="ref-meta"><tr><th>INVOICE #</th><th>DATE</th></tr><tr><td>'+String(inv.invoice_number||'')+'</td><td>'+pretty(inv.invoice_date)+'</td></tr></table></div></div>';var n=1;Object.keys(groups).forEach(function(key){var parts=key.split('|');var list=groups[key];var subtotal=list.reduce(function(a,x){return a+(Number(x.quantity)||0)*(Number(x.rate)||0)},0);html+='<div class="ref-week"><div class="ref-week-title">WEEK '+n+' ('+new Date(parts[0]+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})+'–'+new Date(parts[1]+'T00:00:00').toLocaleDateString('en-US',{day:'numeric'})+')</div><table><thead><tr><th>Date</th><th>Day</th><th>Qty</th><th>Rate (₦)</th><th>Amount (₦)</th></tr></thead><tbody>';list.forEach(function(x){html+='<tr><td>'+new Date(x.item_date+'T00:00:00').toLocaleDateString('en-US',{month:'long',day:'numeric'})+'</td><td>'+x.day_name+'</td><td class="green-number">'+x.quantity+'</td><td class="green-number">'+Number(x.rate||0).toLocaleString('en-NG')+'</td><td>'+Number(x.quantity*x.rate||0).toLocaleString('en-NG')+'</td></tr>'});html+='<tr class="ref-subtotal"><td>Subtotal</td><td></td><td>'+list.reduce(function(a,x){return a+(Number(x.quantity)||0)},0)+'</td><td></td><td>₦'+subtotal.toLocaleString('en-NG',{maximumFractionDigits:2})+'</td></tr></tbody></table></div>';n++});html+='<div class="summary-heading">TOTAL COST SUMMARY</div><div class="ref-summary"><div class="thankyou">Thank you for your patronage</div><div class="summary-items"><div><b>Rate per Meal</b><strong>₦'+(items.length?Number(items[0].rate||0).toLocaleString('en-NG'):'0')+'</strong></div><div><b>Total Meals Sold</b><strong>'+items.reduce(function(a,x){return a+(Number(x.quantity)||0)},0).toLocaleString('en-NG')+' units</strong></div><div><b>Total Cost</b><strong>₦'+Number(inv.subtotal||0).toLocaleString('en-NG',{maximumFractionDigits:2})+'</strong></div><div><b>VAT (7.5%)</b><strong>₦'+Number(inv.vat_amount||0).toLocaleString('en-NG',{maximumFractionDigits:2})+'</strong></div><div class="net"><b>Net Total Cost</b><strong>₦'+Number(inv.total_amount||0).toLocaleString('en-NG',{maximumFractionDigits:2})+'</strong></div></div></div><div class="ref-accounts"><div><b>Account Name: BHIVE Resource Intl LTD</b><br><b>Account Number:0302765150</b><br><b>Bank: GTBANK</b></div><div><b>Account Name: BHIVE Resource Intl LTD</b><br><b>Account Number:1015534430</b><br><b>Bank: ZENITH BANK</b></div></div></div>';document.getElementById('printContent').innerHTML=html;window.currentInvoiceNumber=inv.invoice_number||'invoice';document.getElementById('printModal').classList.add('open')}'''
          s=s[:start]+new_show+s[end:]
          s=s.replace("document.getElementById('printInvoice').addEventListener('click',function(){window.print()});","document.getElementById('downloadInvoice').addEventListener('click',function(){var el=document.getElementById('printContent');var num=(window.currentInvoiceNumber||'invoice').replace(/[^a-z0-9_-]/gi,'_');if(!window.html2pdf){alert('PDF service is still loading. Please try again.');return}window.html2pdf().set({margin:[8,8,8,8],filename:'BHIVE-'+num+'.pdf',image:{type:'jpeg',quality:0.98},html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff'},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'},pagebreak:{mode:['css','legacy']}}).from(el).save()});",1)
          old_table="html='<table class=\"table\"><thead><tr><th>Invoice</th><th>Client</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>';list.forEach(function(i){html+='<tr><td><b>'+String(i.invoice_number||'Invoice')+'</b></td><td>'+String(i.client_name||'')+'</td><td>'+String(i.invoice_date||'')+'</td><td>'+money(i.total_amount)+'</td><td><span class=\"badge\">'+String(i.status||'issued')+'</span></td></tr>'});html+='</tbody></table>';"
          new_table="html='<table class=\"table\"><thead><tr><th>Invoice</th><th>Client</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody>';list.forEach(function(i){html+='<tr><td><b>'+String(i.invoice_number||'Invoice')+'</b></td><td>'+String(i.client_name||'')+'</td><td>'+String(i.invoice_date||'')+'</td><td>'+money(i.total_amount)+'</td><td><span class=\"badge\">'+String(i.status||'issued')+'</span></td><td><button type=\"button\" class=\"btn download-existing\" data-id=\"'+i.id+'\">PDF</button></td></tr>'});html+='</tbody></table>';"
          s=s.replace(old_table,new_table,1)
          marker='async function loadDashboard(){'
          fn=r'''async function downloadExisting(id){var invRes=await client.from('invoices').select('*').eq('id',id).single();if(invRes.error){alert(invRes.error.message);return}var itemRes=await client.from('invoice_items').select('*').eq('invoice_id',id).order('item_date',{ascending:true});if(itemRes.error){alert(itemRes.error.message);return}showPrint(invRes.data,itemRes.data||[]);setTimeout(function(){document.getElementById('downloadInvoice').click()},250)}document.getElementById('invoiceList').addEventListener('click',function(e){var b=e.target.closest('.download-existing');if(b)downloadExisting(b.getAttribute('data-id'))});'''
          s=s.replace(marker,fn+marker,1)
          ref_css=r'''.manual-title{display:flex;justify-content:space-between;align-items:center;gap:20px;margin:20px 0 12px}.manual-title h3{margin:0 0 4px}.entry-table{border:1px solid #dfe6da;border-radius:10px;overflow:hidden}.entry-head,.line{display:grid;grid-template-columns:1.15fr 1fr .75fr .9fr 1fr 42px;gap:0;align-items:center}.entry-head{background:#D2D9EB;font-weight:900;font-size:12px;padding:10px}.line{padding:8px;border-top:1px solid #edf0eb}.line input{border-radius:6px;margin-right:7px}.auto-day,.auto-amount{font-size:13px;font-weight:700;color:#4d584b;padding:0 7px}.auto-amount{color:#111}.remove-line{border:0;background:#fff;color:#a33;font-size:20px;font-weight:900}.invoice-ref{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;color:#000;font-size:9pt;background:#fff}.ref-top{display:grid;grid-template-columns:1fr 1fr;gap:35px;align-items:start;margin-bottom:35px}.ref-logo{font-family:Calibri,"Segoe UI",Arial,sans-serif;font-size:31pt;letter-spacing:-2.2px;font-weight:400;line-height:.9}.ref-address{font-size:8pt;line-height:1.75;margin-top:7px}.bill-label{background:#D2D9EB;border:1px solid #777;width:235px;padding:3px 7px;font-size:9pt;font-weight:900;margin-top:10px}.bill-name{padding:13px 12px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:10pt;min-height:52px}.bill-name span{font-family:Calibri,Candara,"Segoe UI",Arial,sans-serif;font-weight:400;font-size:8.5pt}.ref-right{text-align:right}.ref-word{font-size:29pt;line-height:1;color:#A8EB85;font-weight:700;letter-spacing:.5px;margin-bottom:48px}.ref-meta{width:100%;border-collapse:collapse;text-align:left;font-size:9pt}.ref-meta th{background:#D2D9EB;border:1px solid #777;padding:7px 9px;text-align:center}.ref-meta td{border:1px solid #777;padding:18px 10px}.ref-week{margin-bottom:27px;break-inside:avoid;page-break-inside:avoid}.ref-week-title{color:#58A83D;font-weight:900;font-size:9pt;margin:0 0 10px}.invoice-ref table{width:100%;border-collapse:collapse;table-layout:fixed}.invoice-ref .ref-week table{font-size:7pt}.invoice-ref .ref-week th{background:#D2D9EB;border:1px solid #555;padding:6px 8px;text-align:left;font-weight:900}.invoice-ref .ref-week td{border-left:1px solid #777;border-right:1px solid #777;padding:6px 8px;height:18px}.invoice-ref .ref-week tbody tr:not(.ref-subtotal) td{border-bottom:0}.invoice-ref .ref-week th:nth-child(1),.invoice-ref .ref-week td:nth-child(1){width:21%}.invoice-ref .ref-week th:nth-child(2),.invoice-ref .ref-week td:nth-child(2){width:22%}.invoice-ref .ref-week th:nth-child(3),.invoice-ref .ref-week td:nth-child(3){width:18%}.invoice-ref .ref-week th:nth-child(4),.invoice-ref .ref-week td:nth-child(4){width:20%}.invoice-ref .ref-week th:nth-child(5),.invoice-ref .ref-week td:nth-child(5){width:19%}.green-number{color:#58A83D;font-weight:700}.ref-subtotal td{border-top:1px solid #777!important;border-bottom:1px solid #777!important;font-weight:900;padding:7px 8px!important}.summary-heading{color:#58A83D;font-weight:900;font-size:9pt;margin-top:3px;margin-bottom:10px}.ref-summary{display:grid;grid-template-columns:1fr 1.25fr;border:1px solid #aaa;min-height:90px}.thankyou{font-style:italic;text-align:center;padding:11px;font-size:9pt}.summary-items{border-left:1px solid #aaa;padding:8px 12px;font-size:8.5pt}.summary-items div{display:flex;justify-content:space-between;padding:4px 0}.summary-items b{color:#58A83D}.summary-items .net{padding-top:6px}.ref-accounts{display:grid;grid-template-columns:1fr 1fr;background:#D4F5C3;font-size:10pt;font-weight:900;margin-top:0;break-inside:avoid;page-break-inside:avoid}.ref-accounts>div{padding:8px 10px}.ref-accounts>div+div{border-left:2px solid #fff}.ref-accounts b{font-weight:900}@media print{body>*:not(#printModal){display:none!important}.modal{position:static;display:block;background:#fff;padding:0}.sheet{width:100%;max-height:none;box-shadow:none;padding:0}.toolbar{display:none!important}.invoice-ref{font-size:9pt}.ref-week{break-inside:avoid;page-break-inside:avoid}.ref-week tr{break-inside:avoid;page-break-inside:avoid}.ref-summary,.ref-accounts{break-inside:avoid;page-break-inside:avoid}}'''
          s=s.replace('@media print{body>*:not(#printModal)',ref_css+'@media print{body>*:not(#printModal)',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove updater
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-invoice.yml
          git add index.html
          git commit -m "Refine BHIVE invoice design and PDF download UX"
          git push